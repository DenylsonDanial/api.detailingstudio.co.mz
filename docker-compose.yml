# Ambiente local do Detailing Studio.
# Portas escolhidas para nao colidir com a Everlee Grace (5432/8080/8085/9000):
#   PostgreSQL 5442 · API 8090 · frontend 8095
name: detailingstudio

services:
  db:
    image: postgres:16-alpine
    container_name: ds-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_MASTER_NAME:-ds_master}
      TZ: Africa/Maputo
    ports:
      - "5442:5432"
    volumes:
      - ds-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    profiles: ["full"]
    image: detailingstudio-api:latest
    container_name: ds-api
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      SERVER_PORT: 8090
    ports:
      - "8090:8090"

volumes:
  ds-db-data:

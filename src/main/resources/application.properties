spring.application.name=detailing-api
spring.profiles.active=${APP_PROFILE:dev}
spring.config.import=classpath:api-messages.properties

server.port=${SERVER_PORT:8090}

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# --- Base de dados master -------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_MASTER_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.db.hostname=${DB_HOST}
app.db.port=${DB_PORT}
app.db.master.name=${DB_MASTER_NAME}

# O schema e gerido por Flyway (db/migration/master e db/migration/tenant).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# O Flyway do master e executado manualmente por MasterFlywayConfig, para nao
# correr contra o TenantRoutingDataSource.
spring.flyway.enabled=false

# --- Seguranca ------------------------------------------------------------
security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=${JWT_EXPIRATION_MS:900000}
security.jwt.refresh-expiration-time=${JWT_REFRESH_EXPIRATION_MS:604800000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8095}

# --- Email ----------------------------------------------------------------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:nao-responder@detailingstudio.co.mz}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:8095}

# --- Uploads -------------------------------------------------------------

spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE_MB:10}MB
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE_MB:20}MB
